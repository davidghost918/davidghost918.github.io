<html>

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Это QR-генератор от VI–media</title>
	<style></style>
	<link href="static/css/qr_generator.css" rel="stylesheet">
	<link href="static/css/parts/download_qr.css" rel="stylesheet">
	<link href="static/css/parts/edit_qr.css" rel="stylesheet">
	<link rel="icon" type="image/x-icon" href="static/favicon.ico">
	<link href="static/css/common.css" rel="stylesheet">
	<link href="static/css/parts/change_background.css" rel="stylesheet">
	<link href="static/css/bootstrap/bootstrap.min.css" rel="stylesheet">
	<script src="static/js/bootstrap/bootstrap.bundle.min.js"></script>
	<script src="static/js/qr-code-styling.js"></script>
    <link href="static/animations.css" rel="stylesheet">
</head>

<body>
	<div id="downloadQr" hidden="">
		<div class="background"></div>
		<div class="frame">
			<h1>Скачать QR код</h1> <img class="cross" src="static/images/svg/normal/cross.svg" onclick="downloadQr.setAttribute('hidden', 'hidden')">
			<div class="buttons">
				<button id="downloadPngButton">
					<p>.PNG</p>
				</button>
				<button id="downloadSvgButton">
					<p>.SVG</p>
				</button>
			</div>
		</div>
	</div>
	<script src="static/js/parts/download_qr.js"></script>
	<form id="qrEditor" method="POST" action="/qr/update" enctype="multipart/form-data" hidden="">
		<input type="hidden" name="csrfmiddlewaretoken" value="wpGIELlO3vgvR988wqQT0s4EYM4hF77moE9w90h7FHhEcDdGBGsIiikM9ebDQJKC">
		<div class="background"></div>
		<div class="frame"> <img class="cross" src="static/images/svg/normal/cross.svg" onclick="qrEditor.setAttribute('hidden', 'hidden'); qrEditorCanvas.innerHTML = '';">
			<div class="qr-background">
				<div class="qr-image">
					<div id="qrEditorCanvas"></div>
				</div>
			</div>
			<div class="controls">
				<div class="color-picker">
					<div class="left">
						<p>Цвет QR-кода</p>
					</div>
					<div id="qrColorPicker" class="right">
						<p id="qrColorLabel">#101010</p>
						<input type="color" id="qrColor" name="qrColor" value="#101010"> </div>
				</div>
				<div class="background-toogle">
					<div class="left">
						<p>Фон QR-кода</p>
					</div>
					<div class="right">
						<label class="switch">
							<input name="IsWithBackground" id="backgroundDrawToogle" type="checkbox"> <span class="slider">
                            <span class="label yes">Да</span> <span class="label no">Нет</span> </span>
						</label>
					</div>
				</div>
				<div class="background-color-picker">
					<div class="left">
						<p>Цвет фона</p>
					</div>
					<div id="backgroundColorPicker" class="right">
						<p id="backgroundColorLabel">#FFFFFF</p>
						<input type="color" id="backgroundColor" name="backgroundColor" value="#FFFFFF"> </div>
				</div>
				<div class="image-picker">
					<div class="left">
						<p>Изображение</p>
					</div>
					<div class="right" onclick="logo.click()">
						<input type="file" id="logo" name="logo" accept="image/png, image/jpeg" hidden=""> <img id="fileUploadButton" src="static/images/svg/bold/upload.svg"> </div>
				</div>
			</div>
			<div class="submit-button">
				<input type="submit" value="Сохранить"> </div>
			<input type="text" name="url" value="" hidden=""> </div>
	</form>
	<script src="static/js/parts/edit_qr.js"></script>
    <header>
        <div id="menuPlaceholder" class="menu-placeholder" onclick="changeMenuState()">
            <span>Меню</span>
            <img id="menuPlaceholderImage" src="static/images/svg/normal/menu-placeholder-down.svg">
        </div>
        <div id="menu" class="menu">                
            <a href="index.html">
                <div class="index have-icon">
                    <div>Линкер</div>    
                    <img src="static/images/svg/bold/index.svg" alt="Линкер">
                </div>
            </a>
            <a href="qr.html">
                <div class="qr have-icon selected">
                    <div>QR-генератор</div>
                    <img src="static/images/svg/normal/qr.svg" alt="QR-генератор">
                </div>
            </a>
            <a href="urls-history.html">
                <div class="history have-icon ">
                    <div>История</div>
                    <img src="static/images/svg/normal/history.svg" alt="История">
                </div>
            </a>
            <a href="price.html">
                <div class="price have-icon ">
                    <div>Тарифы</div>
                    <img src="static/images/svg/normal/price.svg" alt="Тарифы">
                </div>
            </a>
        </div>
    </header>
	<script src="static/js/base.js"></script>
	<div class="content ">
		<div class="qr">
			<h1>Генератор QR</h1>
			<form class="url" method="GET" action="qr-with-url.html">
				<input name="url" id="urlInputField" class="url" type="text" placeholder="Нажмите ctrl+v или вставьте ссылку" value="" autofocus="">
				<input id="submitButton" type="submit" class="submit text-label" value="Сократить"> </form>
		</div>
		<script src="static/js/qr_generator.js"></script>
	</div>
	<script>
	function changeMenuState() {
		if(menu.hasAttribute("hidden")) {
			menu.removeAttribute("hidden");
			menuPlaceholderImage.setAttribute("src", "static/images/svg/normal/menu-placeholder-up.svg");
		} else {
			menu.setAttribute("hidden", "hidden");
			menuPlaceholderImage.setAttribute("src", "static/images/svg/normal/menu-placeholder-down.svg");
		}
	}
	// если placeholder отображается, скрываем меню
	if(window.getComputedStyle(menuPlaceholder).display === 'none') {
		menu.removeAttribute("hidden");
	}
	</script>
</body>

</html>
